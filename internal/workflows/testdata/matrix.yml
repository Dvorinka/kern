name: Matrix
on: [push, pull_request]
jobs:
  test:
    runs-on: linux-x64
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
        os: [ubuntu-latest, ubuntu-24.04]
        exclude:
          - go: "1.23"
            os: ubuntu-latest
        include:
          - go: "1.24"
            os: ubuntu-24.04
            experimental: true
    steps:
      - run: echo ${{ matrix.go }}
