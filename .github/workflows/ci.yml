name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  go:
    runs-on: [self-hosted, linux, x64]
    env:
      # /tmp is a 512m noexec tmpfs and counts against the job memory limit.
      # Go's work dir and caches live on the runner's disk mount instead.
      GOCACHE: /kern/cache/gocache
      GOMODCACHE: /kern/cache/gomod
      GOPATH: /kern/cache/gopath
      GOTMPDIR: /kern/cache/gotmp
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE" "$GOPATH"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: gofmt -l cmd internal migrations | tee /dev/stderr | test ! -s /dev/stdin
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1
  web:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: "12.15.0"
          standalone: true # @pnpm/exe bundles node — runners without system node fail otherwise
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
  docs:
    # Dogfood docsync: docs-vs-code drift (env vars, paths, commands, routes).
    # The committed baseline suppresses known findings; only NEW drift fails.
    runs-on: [self-hosted, linux, x64]
    env:
      GOCACHE: /kern/cache/gocache
      GOMODCACHE: /kern/cache/gomod
      GOPATH: /kern/cache/gopath
      GOTMPDIR: /kern/cache/gotmp
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE" "$GOPATH"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go install github.com/Dvorinka/docsync/cmd/docsync@v0.1.0
      - run: docsync check --baseline .docsync-baseline.txt
