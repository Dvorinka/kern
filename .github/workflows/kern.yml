name: KERN CI
# Dogfood pipeline: KERN runs its own push builds on the local fleet via the
# repo webhook. Kept to plain run steps so KERN can execute it natively —
# ci.yml remains the GitHub Actions pipeline.
on:
  push:
    branches: [master]
jobs:
  go:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26
    env:
      # job containers are read-only; keep Go's caches on the /tmp tmpfs
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      GOPATH: /tmp/go
    steps:
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
