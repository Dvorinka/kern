name: KERN CI
# Dogfood pipeline: KERN runs its own push builds on the local fleet via the
# repo webhook. Kept to plain run steps so KERN can execute it natively —
# ci.yml remains the GitHub Actions pipeline.
on:
  push:
    branches: [master]
jobs:
  go:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26
    env:
      # job containers are read-only and /tmp is a small tmpfs; Go dirs live on
      # the /github/cmd bind mount. GOMODCACHE stays workspace-relative so
      # actions/cache can persist it between runs.
      GOCACHE: /github/cmd/gocache
      GOMODCACHE: .gomod
      GOPATH: /github/cmd/gopath
      GOTMPDIR: /github/cmd/gotmp
    steps:
      - uses: actions/cache@v4
        id: modcache
        with:
          key: kern-go-mod-${{ hashFiles('go.sum') }}
          path: .gomod
          restore-keys: |
            kern-go-mod-
      - name: prep Go dirs
        run: mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE" "$GOPATH"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
