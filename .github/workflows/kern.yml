name: KERN CI
# Dogfood pipeline: KERN runs its own push builds on the local fleet via the
# repo webhook. Kept to plain run steps so KERN can execute it natively —
# ci.yml remains the GitHub Actions pipeline.
on:
  push:
    branches: [master]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26
    env:
      # job containers are read-only and /tmp is a small tmpfs; Go dirs live on
      # the /github/cmd bind mount. GOMODCACHE/GOCACHE/GOPATH point at the
      # runner's persistent /kern/cache mount, so warm runs reuse downloaded
      # modules and build output with zero network fetches.
      GOCACHE: /kern/cache/gocache
      GOMODCACHE: /kern/cache/gomod
      GOPATH: /kern/cache/gopath
      GOTMPDIR: /github/cmd/gotmp
      # VCS stamping needs git access to .git; ownership differs inside the
      # GHA job container and KERN doesn't rely on it anyway.
      GOFLAGS: -buildvcs=false
    steps:
      # KERN performs checkout natively and treats this step as a no-op; GitHub
      # Actions needs it to materialise the workspace.
      - uses: actions/checkout@v7
      - name: prep Go dirs
        run: mkdir -p "$GOTMPDIR" "$GOCACHE" "$GOMODCACHE" "$GOPATH"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
