name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p dist
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          for cmd in kern kern-api kern-runner kern-migrate; do
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/dvorinka/kern/internal/version.Version=$TAG" \
              -o dist/$cmd$ext ./cmd/${cmd#kern-}
          done
          tar czf kern-$TAG-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C dist .
          mv kern-*.tar.gz dist/
      - uses: actions/upload-artifact@v7
        with:
          name: bins-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
  release:
    needs: binaries
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
  images:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/api.Dockerfile
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/dvorinka/kern-api:${{ github.ref_name }}
            ghcr.io/dvorinka/kern-api:latest
      - id: runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/runner.Dockerfile
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/dvorinka/kern-runner:${{ github.ref_name }}
            ghcr.io/dvorinka/kern-runner:latest
      # Baseline job image: ubuntu:24.04 + the toolset GitHub-hosted runners
      # ship. Only rebuilt when the Dockerfile (or this workflow) changes, so a
      # normal release reuses the cached layers.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/ubuntu.Dockerfile
          push: true
          tags: |
            ghcr.io/dvorinka/kern-ubuntu:24.04
            ghcr.io/dvorinka/kern-ubuntu:latest
    outputs:
      runner_digest: ${{ steps.runner.outputs.digest }}
  tap:
    needs: release
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: bump homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN unset — formula not updated"
            exit 0
          fi
          V="${TAG#v}"
          curl -fsSL -o sums.txt "https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS"
          sha() { awk -v f="kern-${TAG}-$1.tar.gz" '$2 == f {print $1}' sums.txt; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Dvorinka/homebrew-tap" tap
          cat > tap/Formula/kern.rb <<RUBY
          # Homebrew formula for the \`kern\` CLI. Regenerated by kern's release
          # workflow on every v* tag — do not bump by hand.
          class Kern < Formula
            desc "KERN — self-hosted GitHub Actions-compatible CI control plane and CLI"
            homepage "https://github.com/Dvorinka/kern"
            version "${V}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/Dvorinka/kern/releases/download/v#{version}/kern-v#{version}-darwin-arm64.tar.gz"
                sha256 "$(sha darwin-arm64)"
              end
              on_intel do
                url "https://github.com/Dvorinka/kern/releases/download/v#{version}/kern-v#{version}-darwin-amd64.tar.gz"
                sha256 "$(sha darwin-amd64)"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/Dvorinka/kern/releases/download/v#{version}/kern-v#{version}-linux-arm64.tar.gz"
                sha256 "$(sha linux-arm64)"
              end
              on_intel do
                url "https://github.com/Dvorinka/kern/releases/download/v#{version}/kern-v#{version}-linux-amd64.tar.gz"
                sha256 "$(sha linux-amd64)"
              end
            end

            def install
              bin.install "kern"
              generate_completions_from_executable(bin/"kern", "completion")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/kern version")
            end
          end
          RUBY
          cd tap
          git config user.name "kern-ci[bot]"
          git config user.email "kern-ci[bot]@users.noreply.github.com"
          git add Formula/kern.rb
          git diff --cached --quiet || { git commit -m "kern ${TAG}"; git push; }

  manifest:
    needs: [release, images]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: sign update manifest
        env:
          KEY: ${{ secrets.KERN_UPDATE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.images.outputs.runner_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "$KEY" ]; then
            echo "KERN_UPDATE_SIGNING_KEY is unset; this release has no signed manifest"
            exit 0
          fi
          case "$DIGEST" in
            sha256:[0-9a-f]*) ;;
            *) echo "runner image digest missing" >&2; exit 1 ;;
          esac
          python3 - <<'PY'
          import json, os, urllib.request
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          sums = urllib.request.urlopen(f"{base}/SHA256SUMS").read().decode()
          binaries = {}
          for line in sums.strip().splitlines():
              sha, fn = line.split(None, 1)
              key = fn.removeprefix(f"kern-{tag}-").removesuffix(".tar.gz")
              if key == fn:
                  continue
              binaries[key] = {"url": f"{base}/{fn}", "sha256": sha}
          doc = {
              "version": tag,
              "git_sha": os.environ["SHA"],
              "runner_image": "ghcr.io/dvorinka/kern-runner",
              "runner_digest": os.environ["DIGEST"],
              "binaries": binaries,
          }
          with open("kern-update.json", "wb") as f:
              f.write(json.dumps(doc, separators=(",", ":")).encode())
          PY
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" \
            -in kern-update.json -out kern-update.json.sig
          rm -f "$key"
          rel=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")
          id=$(printf '%s' "$rel" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          upload() {
            name=$1
            file=$2
            ctype=$3
            code=$(curl -sS -o /tmp/kern-upload.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $ctype" \
              -H "Accept: application/vnd.github+json" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${REPO}/releases/${id}/assets?name=${name}")
            if [ "$code" = "201" ]; then
              return 0
            fi
            echo "upload $name returned $code" >&2
            cat /tmp/kern-upload.json >&2
            return 1
          }
          upload kern-update.json kern-update.json application/json
          upload kern-update.json.sig kern-update.json.sig application/octet-stream
