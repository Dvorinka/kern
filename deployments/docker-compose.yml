# KERN — Docker Compose for a single-host control plane.
# Usage:  docker compose -f deployments/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kern
      POSTGRES_PASSWORD: kern
      POSTGRES_DB: kern
    volumes:
      - kern-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kern -d kern"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deployments/api.Dockerfile
      args:
        # Stamp the binary with the deployed tag; unset falls back to "dev".
        VERSION: ${KERN_VERSION:-dev}
    image: kern-api:local
    environment:
      KERN_ENV: production
      KERN_HTTP_ADDR: ":8080"
      KERN_DATABASE_URL: postgres://kern:kern@postgres:5432/kern?sslmode=disable
      KERN_BLOB_DIR: /data/blobs
      KERN_SESSION_SECRET: ${KERN_SESSION_SECRET:?set KERN_SESSION_SECRET (32+ chars)}
      KERN_SECRET_KEY: ${KERN_SECRET_KEY:?set KERN_SECRET_KEY (32 bytes)}
      KERN_BOOTSTRAP_EMAIL: ${KERN_BOOTSTRAP_EMAIL:-admin@kern.local}
      KERN_BOOTSTRAP_PASSWORD: ${KERN_BOOTSTRAP_PASSWORD:-kern-admin-password}
      KERN_BOOTSTRAP_ORG: ${KERN_BOOTSTRAP_ORG:-kern}
      KERN_RUNNER_JOIN_TOKEN: ${KERN_RUNNER_JOIN_TOKEN:?set KERN_RUNNER_JOIN_TOKEN}
      KERN_PUBLIC_URL: ${KERN_PUBLIC_URL:-http://localhost:8080}
      KERN_ALLOWED_ORIGINS: ${KERN_ALLOWED_ORIGINS:-}
      # Job image for `runs-on: ubuntu-latest` / no container:. The published
      # base image carries the GitHub-parity toolset; a bare ubuntu:24.04 is
      # the fallback when the image is not reachable. No compose default: a
      # bare `up` without --env-file must fail loudly, not ship ubuntu:24.04.
      KERN_DEFAULT_IMAGE: ${KERN_DEFAULT_IMAGE:?set KERN_DEFAULT_IMAGE (see .env.example)}
      # Optional arm64 substitute for KERN_DEFAULT_IMAGE (see .env.example).
      KERN_ARM64_IMAGE: ${KERN_ARM64_IMAGE:-}
      KERN_GITHUB_APP_ID: ${KERN_GITHUB_APP_ID:-}
      KERN_GITHUB_APP_PRIVATE_KEY_FILE: ${KERN_GITHUB_APP_PRIVATE_KEY_FILE:-}
      KERN_GITHUB_WEBHOOK_SECRET: ${KERN_GITHUB_WEBHOOK_SECRET:-}
      KERN_GITHUB_TOKEN: ${KERN_GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - kern-blobs:/data/blobs
      # The App pem mounts read-only; the env default /dev/null is a no-op.
      - ${KERN_GITHUB_APP_KEY_FILE:-/dev/null}:/run/kern-app.pem:ro

  # The bundled runner is profile-gated: a bare `up` (and the host updater)
  # starts only the control plane. Enable with COMPOSE_PROFILES=runner or
  # `--profile runner` on hosts that should also run jobs.
  runner:
    profiles: ["runner"]
    build:
      context: ..
      dockerfile: deployments/runner.Dockerfile
      args:
        VERSION: ${KERN_VERSION:-dev}
    image: kern-runner:local
    environment:
      KERN_RUNNER_JOIN_TOKEN: ${KERN_RUNNER_JOIN_TOKEN:?set KERN_RUNNER_JOIN_TOKEN}
      KERN_RUNNER_CONCURRENCY: ${KERN_RUNNER_CONCURRENCY:-1}
      KERN_RUNNER_LOAD_GATE: ${KERN_RUNNER_LOAD_GATE:-0}
      KERN_RUNNER_IMAGE_MAX_AGE: ${KERN_RUNNER_IMAGE_MAX_AGE:-168h}
      KERN_RUNNER_LABELS: ${KERN_RUNNER_LABELS:-}
      KERN_JOB_CPUS: ${KERN_JOB_CPUS:-}
      KERN_JOB_MEMORY: ${KERN_JOB_MEMORY:-}
    command:
      - --control
      - http://api:8080
      - --join-token
      - ${KERN_RUNNER_JOIN_TOKEN}
      - --work-root
      - /opt/kern/work
      - --name
      - ${KERN_RUNNER_NAME:-compose-runner}
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Job bind mounts are resolved by the host docker daemon, so the work
      # root must be the same path inside and outside this container.
      - ${KERN_RUNNER_WORK:-/opt/kern/work}:/opt/kern/work
      # docker-compose `./` volumes in privileged jobs resolve client-side to
      # /github/workspace; this host dir carries the per-job workspace symlink.
      - /github:/github

  # The API cannot replace its own container. This sidecar is started with
  # the compose profile "update" and is the process that recreates api and
  # the compose runner. `up --no-deps api runner` does not include it.
  updater:
    profiles: ["update"]
    image: docker:27.5.1-cli
    # pid:host lets the stale-process guard see kern-api instances leaked by
    # containerd tasks whose docker-side container is already gone (#178).
    pid: host
    entrypoint: ["/bin/sh", "/opt/kern/src/deployments/kern-updater.sh"]
    environment:
      KERN_RUNNER_JOIN_TOKEN: ${KERN_RUNNER_JOIN_TOKEN:?set KERN_RUNNER_JOIN_TOKEN}
      KERN_API_URL: http://api:8080
      KERN_SRC: /opt/kern/src
      KERN_ENV_FILE: /opt/kern/.env
      KERN_RELEASE_REPO: ${KERN_RELEASE_REPO:-Dvorinka/kern}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KERN_SRC:-/opt/kern/src}:/opt/kern/src
      # dir bind, not the file: a replaced .env (new inode) must stay live.
      # A custom KERN_ENV_FILE outside /opt/kern needs its own mount.
      - /opt/kern:/opt/kern:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  kern-db:
  kern-blobs:
